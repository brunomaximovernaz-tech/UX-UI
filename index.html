<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Portfolio personal | Nombre Apellido</title>
    <meta
      name="description"
      content="Portfolio personal de Nombre Apellido: proyectos, experiencia y habilidades."
    />

    <meta property="og:title" content="Portfolio personal | Nombre Apellido" />
    <meta
      property="og:description"
      content="Conocé los proyectos, la experiencia y las habilidades de Nombre Apellido."
    />
    <meta property="og:image" content="https://tu-dominio.com/og-image.jpg" />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%97%86%3C/text%3E%3C/svg%3E"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur-sm">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <a
          href="#hero"
          class="text-2xl font-bold tracking-tight text-slate-900"
          aria-label="BV, inicio"
        >
          BV
        </a>

        <nav class="hidden md:block" aria-label="Navegación principal">
          <ul class="flex items-center gap-8">
            <li><a href="#hero" class="text-sm font-medium text-slate-600 transition-colors hover:text-blue-600">Inicio</a></li>
            <li><a href="#skills" class="text-sm font-medium text-slate-600 transition-colors hover:text-blue-600">Habilidades</a></li>
            <li><a href="#proyectos" class="text-sm font-medium text-slate-600 transition-colors hover:text-blue-600">Proyectos</a></li>
            <li><a href="#experiencia" class="text-sm font-medium text-slate-600 transition-colors hover:text-blue-600">Experiencia</a></li>
            <li><a href="#sobre-mi" class="text-sm font-medium text-slate-600 transition-colors hover:text-blue-600">Sobre mí</a></li>
          </ul>
        </nav>

        <div class="hidden items-center gap-5 md:flex">
          <a
            href="https://github.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub (se abre en una pestaña nueva)"
            class="text-slate-600 transition-colors hover:text-blue-600"
          >
            <svg
              aria-hidden="true"
              class="h-6 w-6"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.69 2.08 3.5 1.48.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.06 1.15a10.64 10.64 0 0 1 5.57 0c2.12-1.45 3.06-1.15 3.06-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.61 5.23-5.1 5.51.4.35.76 1.03.76 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z" />
            </svg>
          </a>
          <a
            href="#contacto"
            class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
          >
            Contacto
          </a>
        </div>

        <button
          type="button"
          class="rounded-md p-2 text-slate-700 transition-colors hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 md:hidden"
          aria-label="Abrir menú de navegación"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <svg
            aria-hidden="true"
            class="h-6 w-6"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

      <nav
        id="mobile-menu"
        class="hidden border-t border-slate-200 bg-white px-4 py-4 md:hidden"
        aria-label="Navegación móvil"
      >
        <ul class="flex flex-col gap-1">
          <li><a href="#hero" class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 transition-colors hover:bg-slate-100 hover:text-blue-600">Inicio</a></li>
          <li><a href="#skills" class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 transition-colors hover:bg-slate-100 hover:text-blue-600">Habilidades</a></li>
          <li><a href="#proyectos" class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 transition-colors hover:bg-slate-100 hover:text-blue-600">Proyectos</a></li>
          <li><a href="#experiencia" class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 transition-colors hover:bg-slate-100 hover:text-blue-600">Experiencia</a></li>
          <li><a href="#sobre-mi" class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 transition-colors hover:bg-slate-100 hover:text-blue-600">Sobre mí</a></li>
          <li>
            <a
              href="#contacto"
              class="mt-2 block rounded-lg bg-blue-600 px-3 py-2 text-center text-base font-semibold text-white transition-colors hover:bg-blue-700"
            >
              Contacto
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="hero" aria-label="Presentación"></section>
      <section id="metricas" aria-label="Métricas"></section>
      <section id="skills" aria-label="Habilidades"></section>
      <section id="proyectos" aria-label="Proyectos"></section>
      <section id="experiencia" aria-label="Experiencia"></section>
      <section id="sobre-mi" aria-label="Sobre mí"></section>
      <section id="contacto" aria-label="Contacto"></section>
    </main>

    <footer></footer>
  </body>
</html>
